<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ERHS Senior High School Grade Portal</title>
    <style>
        :root {
            --primary-color: #003366;
            --accent-color: #f1c40f;
            --bg-color: #eef2f5;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 850px;
            margin: 0 auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            border-top: 6px solid var(--primary-color);
        }

        h1 {
            color: var(--primary-color);
            text-align: center;
            margin-bottom: 5px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-top: 0;
            font-size: 14px;
        }

        .card {
            background: #f9f9f9;
            padding: 20px;
            border-radius: 8px;
            border: 1px solid #ddd;
            margin-top: 20px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 5px;
            color: #333;
        }

        input, select {
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 14px;
        }

        .grid-3 {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 10px;
        }

        button {
            width: 100%;
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 12px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 10px;
        }

        button:hover {
            background-color: #002244;
        }

        .result-box {
            margin-top: 25px;
            padding: 20px;
            border-radius: 8px;
            text-align: center;
            font-size: 18px;
        }

        .pass {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .fail {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .hidden {
            display: none;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Ernesto Rondon High School</h1>
    <p class="subtitle">DepEd DM 074, s. 2025 Grade Computation Engine</p>

    <div class="card">
        <h3>Teacher Grade Calculator / Encoder</h3>
        
        <div class="form-group">
            <label for="subjectName">Subject Name</label>
            <input type="text" id="subjectName" placeholder="e.g., General Mathematics">
        </div>

        <div class="form-group">
            <label for="category">Subject Category</label>
            <select id="category">
                <option value="CORE">Core Subject (WW 25% | PT 50% | QA 25%)</option>
                <option value="ACADEMIC_ELECTIVE">Academic Elective (WW 25% | PT 45% | QA 30%)</option>
                <option value="TECHPRO_ELECTIVE">TechPro Elective (WW 20% | PT 60% | QA 20%)</option>
                <option value="WORK_IMMERSION">Work Immersion (WW 20% | PT 80% | QA 0%)</option>
            </select>
        </div>

        <div class="form-group grid-3">
            <div>
                <label for="ww">Written Works (%)</label>
                <input type="number" id="ww" min="0" max="100" placeholder="0 - 100">
            </div>
            <div>
                <label for="pt">Performance Tasks (%)</label>
                <input type="number" id="pt" min="0" max="100" placeholder="0 - 100">
            </div>
            <div>
                <label for="qa">Quarterly Exam (%)</label>
                <input type="number" id="qa" min="0" max="100" placeholder="0 - 100">
            </div>
        </div>

        <button onclick="calculateGrade()">Compute Grade</button>
    </div>

    <!-- Output Section -->
    <div id="resultCard" class="result-box hidden">
        <h2 id="resSubject">Subject</h2>
        <p>Initial Percentage Grade: <strong id="resInitial">0</strong>%</p>
        <p>Transmuted Final Grade: <strong id="resTransmuted" style="font-size: 28px;">0</strong></p>
        <p>Status: <strong id="resStatus">--</strong></p>
    </div>
</div>

<script>
    async function calculateGrade() {
        const subject = document.getElementById('subjectName').value || "Subject";
        const category = document.getElementById('category').value;
        const ww = parseFloat(document.getElementById('ww').value) || 0;
        const pt = parseFloat(document.getElementById('pt').value) || 0;
        const qa = parseFloat(document.getElementById('qa').value) || 0;

        const payload = {
            subject_name: subject,
            category: category,
            written_works_pct: ww,
            performance_tasks_pct: pt,
            quarterly_exam_pct: qa
        };

        try {
            const response = await fetch('https://deped-shs-grading-engine.onrender.com/api/v1/calculate/subject', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            if (!response.ok) {
                alert("Error calculating grade. Please check your inputs.");
                return;
            }

            const data = await response.json();
            const res = data.result;

            document.getElementById('resSubject').innerText = data.subject;
            document.getElementById('resInitial').innerText = res.initial_grade;
            document.getElementById('resTransmuted').innerText = res.transmuted_grade;
            
            const statusElem = document.getElementById('resStatus');
            const resultCard = document.getElementById('resultCard');

            if (res.is_passing) {
                statusElem.innerText = "PASSED";
                resultCard.className = "result-box pass";
            } else {
                statusElem.innerText = "FAILED";
                resultCard.className = "result-box fail";
            }

            resultCard.classList.remove('hidden');
        } catch (err) {
            alert("Could not connect to backend server. Make sure FastAPI is running!");
        }
    }
</script>

</body>
</html>
